<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mia Money Exchange</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
<div id="root"></div>

<script type="text/babel">
    const App = () => {

        const [rateData, setRateData] = React.useState(null);
        const [loading, setLoading] = React.useState(true);

        //
        // Calculator input states
        const [mmkAmount,setMmkAmount] = React.useState("");
        const [thbAmount,setThbAmount] = React.useState("");
        const [calcDirection, setCalcDirection] = React.useState("MMK_TO_THB");



        // Calculate displayed exchange rates
        const kyatToBahtRate = rateData
            ? (100000/((100000/rateData.sell)+1))
            : 0;

        const bahtToKyatRate = rateData
            ? (100000/((100000/rateData.buy)-1))
            : 0;


        const selectedRate =
            calcDirection === "MMK_TO_THB"
                ? 100000/kyatToBahtRate
                : 100000/bahtToKyatRate;


        // MMK input handler
        const handleMmkChange = (value) => {
            setMmkAmount(value);

            if (value === "" || !rateData) {
                setThbAmount("");
                return;
            }

            const amount = Number(value);

            if (!Number.isFinite(amount) || amount < 0 || selectedRate <= 0) {
                setThbAmount("");
                return;
            }
            setThbAmount((Math.floor((amount / selectedRate) * 100) / 100).toFixed(2));
        };


        // THB input handler
        const handleThbChange = (value) => {
            setThbAmount(value);

            if (value === "" || !rateData) {
                setMmkAmount("");
                return;
            }

            const amount = Number(value);

            if (!Number.isFinite(amount) || amount < 0 || selectedRate <= 0) {
                setMmkAmount("");
                return;
            }
            setMmkAmount(Math.floor((amount / (Math.floor((100000 / ((100000 / rateData.sell) + 1)) * 100) / 100)) * 100000));
        };



        const fetchRates = async () => {
            setLoading(true);
            try {
                const response = await fetch('https://kbk-money.89-167-6-122.nip.io/api/rate');
                const data = await response.json();
                setRateData(data);
            } catch (err) {
                console.error("Fetch error:", err);
            } finally {
                setLoading(false);
            }
        };

        React.useEffect(() => {
            fetchRates();
        }, []);

        return (
            <div className="min-h-screen flex items-center justify-center p-4">
                <div className="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-sm border border-gray-700">
                    <h1 className="text-2xl font-bold text-center text-yellow-500 mb-6">Mia Money Exchange</h1>

                    {loading ? (
                        <div className="text-center text-gray-400">Loading rates...</div>
                    ) : rateData ? (
                        <div className="space-y-6">
                            <div className="flex justify-between items-center bg-gray-700 p-4 rounded-lg border border-yellow-500/30">
                                <span className="text-gray-400">Kyat to Baht</span>
                                <span className="text-xl font-bold text-green-500">
                                    {(Math.floor((100000 / ((100000 / rateData.sell) + 1)) * 100) / 100).toFixed(2)}
                                        </span>
                            </div>
                            <div className="flex justify-between items-center bg-gray-700 p-4 rounded-lg border border-yellow-500/30">
                                <span className="text-gray-400">Baht to Kyat</span>
                                <span className="text-xl font-bold text-red-500">
                                      {(Math.floor((100000/((100000/rateData.buy)-1))*100)/100).toFixed(2)}
                                    </span>
                            </div>
                            <div className="text-xs text-gray-500 text-center mt-4">
                                Last Updated: {rateData.date} at {rateData.time}
                            </div>





                            {/* Exchange Calculator */}
                            <div className="bg-gray-900 p-5 rounded-xl border border-gray-600 space-y-4">

                                <h2 className="text-xl font-bold text-yellow-500 text-center">
                                    Exchange Calculator
                                </h2>

                                {/* Direction Buttons */}

                                <div className="grid grid-cols-2 gap-2">

                                    <button
                                        onClick={() => {
                                            setCalcDirection("MMK_TO_THB");
                                            setRateData()
                                            setMmkAmount("");
                                            setThbAmount("");
                                        }}
                                        className={`py-3 rounded-lg font-bold ${
                                            calcDirection === "MMK_TO_THB"
                                                ? "bg-yellow-500 text-gray-900"
                                                : "bg-gray-700 text-white"
                                        }`}
                                    >
                                        Kyat → Baht
                                    </button>

                                    <button
                                        onClick={() => {
                                            setCalcDirection("THB_TO_MMK");
                                            setMmkAmount("");
                                            setThbAmount("");
                                        }}
                                        className={`py-3 rounded-lg font-bold ${
                                            calcDirection === "THB_TO_MMK"
                                                ? "bg-yellow-500 text-gray-900"
                                                : "bg-gray-700 text-white"
                                        }`}
                                    >
                                        Baht → Kyat
                                    </button>

                                </div>
                                {/* MMK Input */}

                                <div className="bg-gray-700 p-4 rounded-lg border border-gray-600">

                                    <label className="block text-gray-400 text-sm mb-2">
                                        Myanmar Kyat
                                    </label>

                                    <div className="flex items-center gap-2">

                                        <span className="text-2xl">🇲🇲</span>

                                        <input
                                            type="number"
                                            min="0"
                                            step="any"
                                            value={mmkAmount}
                                            onChange={(e) => handleMmkChange(e.target.value)}
                                            placeholder="0"
                                            className="w-full bg-transparent text-white text-2xl font-semibold outline-none placeholder-gray-500"
                                        />

                                        <span className="text-gray-400 font-bold">MMK</span>

                                    </div>

                                </div>
                                {/* Conversion Arrow */}

                                <div className="flex justify-center">
                                    <span className="text-yellow-500 text-2xl">⇅</span>
                                </div>


                                {/* THB Input */}

                                <div className="bg-gray-700 p-4 rounded-lg border border-gray-600">

                                    <label className="block text-gray-400 text-sm mb-2">
                                        Thai Baht
                                    </label>

                                    <div className="flex items-center gap-2">

                                        <span className="text-2xl">🇹🇭</span>

                                        <input
                                            type="number"
                                            min="0"
                                            step="any"
                                            value={thbAmount}
                                            onChange={(e) => handleThbChange(e.target.value)}

                                            placeholder="0"
                                            className="w-full bg-transparent text-white text-2xl font-semibold outline-none placeholder-gray-500"
                                        />

                                        <span className="text-gray-400 font-bold">THB</span>

                                    </div>

                                </div>



                                {/* Selected Rate */}
                                <div className="text-center text-xs text-gray-500">

                                    Selected Rate: {
                                    calcDirection === "MMK_TO_THB"
                                        ? (Math.floor(kyatToBahtRate * 100) / 100).toFixed(2)
                                        : (Math.floor(BahtToKyatRate * 100) / 100).toFixed(2)
                                }

                                </div>

                            </div>





                            {/* Contact Us Section */}
                            <div className="mt-8 bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                                <h3 className="text-lg font-bold text-gray-800 mb-4 text-center">Contact Us</h3>

                                <div className="flex flex-col space-y-3">
                                    {/* Viber Button */}
                                    <a
                                        href="viber://chat?number=%2B66000000000"
                                        className="flex items-center justify-center space-x-2 bg-[#7360f2] text-white font-medium py-3 px-4 rounded-lg hover:bg-[#5c4cd9] transition-colors"
                                    >
                                        <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M22 10.96a10.45 10.45 0 0 0-4.08-8.15C15.42.72 12.18 0 8.79 0 5.4 0 2.16.72-.37 2.81a10.45 10.45 0 0 0-4.08 8.15c0 1.25.19 2.45.54 3.6-1.57 1.34-2.82 2.8-2.67 3.3.16.51 1.76.13 3.51-.57.86.3 1.76.5 2.68.58v.02c3.39.71 6.63.15 9.13-1.93 2.53-2.11 4.08-5.32 4.08-8.5v-1.02z" transform="translate(4.37 1.5)"/>
                                        </svg>
                                        <span>Chat on Viber</span>
                                    </a>

                                    {/* Telegram Button */}
                                    <a
                                        href="https://t.me/your_username"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="flex items-center justify-center space-x-2 bg-[#0088cc] text-white font-medium py-3 px-4 rounded-lg hover:bg-[#0077b3] transition-colors"
                                    >
                                        <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                                        </svg>
                                        <span>Contact via Telegram</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="text-center text-red-400">Error loading data.</div>
                    )}
                </div>
            </div>


        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
