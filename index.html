<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mia Money Exchange</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div id="root"></div>

    <script type="text/babel">
        const App = () => {
            const [rateData, setRateData] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            const fetchRates = async () => {
                setLoading(true);
                try {
                    const response = await fetch('https://kbk-money.89-167-6-122.nip.io/api/rate');
                    const data = await response.json();
                    setRateData(data);
                } catch (err) {
                    console.error("Fetch error:", err);
                } finally {
                    setLoading(false);
                }
            };

            React.useEffect(() => {
                fetchRates();
            }, []);

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-sm border border-gray-700">
                        <h1 className="text-2xl font-bold text-center text-yellow-500 mb-6">Mia Money Exchange</h1>
                        
                        {loading ? (
                            <div className="text-center text-gray-400">Loading rates...</div>
                        ) : rateData ? (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-gray-700 p-4 rounded-lg">
                                    <span className="text-gray-400">Baht to Kyat</span>
                                    <span className="text-xl font-bold text-white">{rateData.buy}</span>
                                    <span className="text-xl font-bold text-yellow-500">
                                      {(100000 / rateData.buy).toFixed(2)}
                                    </span>
                                </div>
                                <div className="flex justify-between items-center bg-gray-700 p-4 rounded-lg border border-yellow-500/30">
                                    <span className="text-gray-400">Kyat to Baht</span>
                                    <span className="text-xl font-bold text-yellow-500">{rateData.sell}</span>
                                    <span className="text-xl font-bold text-yellow-500">
                                      {(100000 / rateData.sell).toFixed(2)}
                                    </span>
                                </div>
                                <div className="text-xs text-gray-500 text-center mt-4">
                                    Last Updated: {rateData.date} at {rateData.time}
                                </div>
                            </div>
                        ) : (
                            <div className="text-center text-red-400">Error loading data.</div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
